<!DOCTYPE html>
<html lang="tr">
	<head>
		<title>İletişim</title>
		<link rel="icon" type="image/x-icon" href="resimler/icon.png">
		
		<style>
			* { box-sizing: border-box; }
			
			body {
				font-family: 'Poppins', sans-serif;
				margin: 10px;
				/* Ana sayfa ile aynı aydınlık arka plan */
				background: linear-gradient(135deg, #fdfbfb, #ebedee, #e2ebf0);
				background-attachment: fixed;
				color: #2c3e50;
			}
			
			h1, h2 { font-family: 'Playfair Display', serif; }
			
			.menu { display: flex; gap: 10px; padding: 10px; }
			
			.anaButon {
				display: inline-block;
				margin: 2px;
				padding: 8px 20px;
				text-align: center;
				background-color: rgba(255, 255, 255, 0.7);
				backdrop-filter: blur(10px);
				border-radius: 12px; 
				font-weight: 600;
				font-size: 14px;
				color: #2c3e50 !important;
				text-decoration: none;
				border: 1px solid rgba(255, 255, 255, 0.8);
				box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
				transition: all 0.3s ease;
			}
			
			.anaButon:hover {
				background-color: #2c3e50;
				color: #ffffff !important;
				transform: translateY(-3px);
				box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
			}

			.header {
				background: rgba(255, 255, 255, 0.5);
				backdrop-filter: blur(15px);
				color: #2c3e50;
				border: 1px solid rgba(255, 255, 255, 0.8);
				margin: 5px 0 25px 0;
				padding: 40px;
				text-align: center;
				border-radius: 15px;
				box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
			}

			/* İletişim Formu Kutusu */
			.iletisim-container {
				max-width: 600px;
				margin: 0 auto;
				padding: 40px;
				background: rgba(255, 255, 255, 0.4);
				backdrop-filter: blur(15px);
				border: 1px solid rgba(255, 255, 255, 0.8);
				border-radius: 20px;
				box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
			}

			.form-group { margin-bottom: 20px; text-align: left; }
			
			label { display: block; margin-bottom: 8px; font-weight: 600; }
			
			input, textarea {
				width: 100%;
				padding: 12px;
				border-radius: 10px;
				border: 1px solid rgba(0,0,0,0.1);
				background: rgba(255, 255, 255, 0.5);
				font-family: 'Poppins', sans-serif;
			}

			textarea { height: 150px; resize: none; }

			input:focus, textarea:focus {
				outline: none;
				border-color: #2c3e50;
				background: white;
			}

			.gonder-btn {
				width: 100%;
				padding: 12px;
				background-color: #2c3e50;
				color: white;
				border: none;
				border-radius: 10px;
				font-weight: bold;
				cursor: pointer;
				transition: 0.3s;
			}

			.gonder-btn:hover { background-color: #4a627a; }

			@media screen and (max-width: 600px) {
				.iletisim-container { padding: 20px; }
			}
		</style>
	</head>
	
	<body>
		<div class="menu">
			<a href="Oyluyoruz.html" class="anaButon">Ana Sayfa</a>
		</div>
	
		<div class="header">
			<h1>İletişim</h1>
		</div>
		
		<div class="iletisim-container">
			<form action="#">
				<div class="form-group">
					<label for="isim">Adınız</label>
					<input type="text" id="isim" placeholder="Adınızı giriniz..." required>
				</div>
				
				<div class="form-group">
					<label for="email">E-posta Adresiniz</label>
					<input type="email" id="email" placeholder="ornek@mail.com" required>
				</div>
				
				<div class="form-group">
					<label for="mesaj">Mesajınız</label>
					<textarea id="mesaj" placeholder="Site hakkında önerilerinizi veya şikayetlerinizi buraya yazabilirsiniz..." required></textarea>
				</div>
				
				<button type="submit" class="gonder-btn">Gönder</button>
			</form>
		</div>
	</body>
</html>
